name: S6 - Gate de gobierno de agentes

on:
  pull_request:
    paths:
      - "agentes/**"
      - "manifiestos/**"
      - "herramientas/validar_manifiesto.py"
      - "labs/S6-gobierno/**"
      - ".github/workflows/gate-manifiesto.yml"

permissions:
  contents: read

jobs:
  validar-manifiestos:
    name: Validar manifiestos y hashes
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar que existen manifiestos
        shell: bash
        run: |
          if ! find manifiestos -type f \( -name "*.yml" -o -name "*.yaml" \) | grep -q .; then
            echo "::error::No existe ningún Agent Release Manifest"
            exit 1
          fi

      - name: Validar contenido, fechas y hashes
        run: python herramientas/validar_manifiesto.py

  pruebas:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear carpetas de evidencia
        run: |
          mkdir -p evidencias/tests
          mkdir -p evidencias/cobertura
          mkdir -p evidencias/conformidad
          mkdir -p evidencias/seguridad

      - name: Ejecutar tests y cobertura
        run: |
          python -m pytest tests/ \
            --junitxml=evidencias/tests/resultados.xml \
            --cov=src/aula \
            --cov-report=xml:evidencias/cobertura/coverage.xml

      - name: Evaluar el agente de conformidad
        run: |
          python -m agentes.conformidad.evaluar \
            --dorado evals/dorado_ejemplo \
            --guardar

      - name: Comprobar dependencias instaladas
        run: |
          python -m pip check | tee evidencias/seguridad/dependencias.txt

      - name: Comprobar espacios y errores de formato
        run: git diff --check

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-s6
          path: |
            evidencias/
            evals/informes/